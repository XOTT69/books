name: iPhone library regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  webkit:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm test
